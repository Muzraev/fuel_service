{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис учета топлива{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
      rel="stylesheet"
      href="{% static 'homepage/css/style.css' %}"
    >
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="{% url 'homepage:index' %}">
          <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="Сервис учета топлива"
            class="fuel-logo"
          >
        </a>
        <div class="site-title">Сервис учета топлива</div>
      </div>
      {% include "includes/navigation.html" %}
    </header>

    <main class="container">
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="container site-footer">
      <p>© <span id="current-year"></span> Сервис учета топлива</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
  </body>
</html>
